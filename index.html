<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar Todo-list App</title>

  <!-- I tried to keep look i gave to my first ToDo list so i used Bootstrap just for some slight upgrades -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="App">
        <div class="upper-container">
            <h1>My Todo List</h1>
            <div id="task-counter">0 / 0</div>
        </div>

        <div class="container">
            <div class="calendar-header">
                <button type="button" id="prev-month" class="month-btn">‹</button>

                <div class="calendar-title-box">
                    <h2 id="month-title">Month</h2>
                    <button type="button" id="today-btn" class="today-btn">Today</button>
                </div>

                <button type="button" id="next-month" class="month-btn">›</button>
            </div>

            <div class="week-days">
                <span>Mon</span>
                <span>Tue</span>
                <span>Wed</span>
                <span>Thu</span>
                <span>Fri</span>
                <span>Sat</span>
                <span>Sun</span>
            </div>

            <div id="calendar" class="calendar-grid"></div>

            <div class="todo-panel">
                <p id="selected-date">Selected day:</p>

                <form id="todo-form">
                    <input type="text" id="task-input" placeholder="Enter a task for selected day">
                    <button type="submit">Add</button>
                </form>

                <p id="error-msg"></p>
                <ul id="task-list"></ul>

                <div class="bottom-buttons">
                    <button type="button" id="delete-selected">Delete Selected</button>
                    <button type="button" id="clear-all">Clear Day</button>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery is for DOM scripts and eventListeners -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Axios is used for AJAX requests, also i used for holiday marks in calendar -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <script src="script.js"></script>
</body>
</html>
